# Entorno conda para el programa de diseño de zapatas aisladas (ACI 318-19)
# Solo para uso local. No se llama environment.yml para que Streamlit Cloud use
# requirements.txt (pip), que instala mucho más rápido.
# Crear:   conda env create -f entorno-conda.yml
# Activar: conda activate zapatas
name: zapatas
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23
  - pandas>=1.5
  - matplotlib>=3.6
  - openpyxl>=3.1
  - tk
  - streamlit>=1.50   # versión web (app.py)
  - spyder   # opcional: editor usado en el curso
