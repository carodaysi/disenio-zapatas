# Configuración de la versión web (app.py)
[theme]
base = "light"
primaryColor = "#1F3A5F"

[client]
# Oculta el botón "Deploy" y el menú de tres puntos (con su "Made with Streamlit")
toolbarMode = "minimal"

[server]
# Tamaño máximo del Excel que se puede subir [MB]
maxUploadSize = 10

[browser]
# No enviar estadísticas de uso a Streamlit
gatherUsageStats = false
