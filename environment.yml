# Entorno conda para el programa de diseño de zapatas aisladas (ACI 318-19)
# Crear:   conda env create -f environment.yml
# Activar: conda activate zapatas
name: zapatas
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23
  - pandas>=1.5
  - matplotlib>=3.6
  - openpyxl>=3.1
  - tk
  - spyder   # opcional: editor usado en el curso
